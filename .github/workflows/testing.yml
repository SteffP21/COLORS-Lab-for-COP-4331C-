---
name: Unit and Integration tests

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: COP4331
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_HOST: 127.0.0.1
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: COP4331
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node.js startup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: PHP startup
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: "8.2"
          extensions: mysqli

      - name: Node.js CI
        run: npm ci

      - name: Create tables and load test data
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec -i "$MYSQL_CONTAINER_ID" \
            mysql -u "$DB_USER" -p"$DB_PASSWORD" \
            "$DB_NAME" < tests/queries.sql

      - name: Run PHP and tests
        run: |
          php -S 127.0.0.1:8000 -t . > php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          attempt=1
          while [ "$attempt" -le 30 ]; do
            if curl -fsS \
              http://127.0.0.1:8000/API/Login.php \
              -o /dev/null 2>/dev/null; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 1
          done

          if ! curl -fsS \
            http://127.0.0.1:8000/API/Login.php -o /dev/null; then
            cat php-server.log
            exit 1
          fi

          npm test
